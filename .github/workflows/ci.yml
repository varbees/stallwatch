name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt, clippy, test (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-gnu, x86_64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: cargo fmt --check
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --target ${{ matrix.target }} -- -D warnings

      - name: cargo test
        # PSI attribution tests read real /proc and /sys, which the musl
        # cross-target's host libc quirks don't affect — running the suite
        # once under the native target is sufficient; musl only needs to build.
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo test --all-targets

      - name: cargo build --release
        run: cargo build --release --target ${{ matrix.target }}

  package-metadata:
    name: crates.io packaging check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo publish --dry-run
        run: cargo publish --dry-run

  installer:
    name: installer is valid and served copy matches
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The site serves its own copy so `curl | sh` needs no second host. Two
      # copies of a script that installs binaries is exactly the kind of thing
      # that silently drifts, so it is a build failure rather than a habit.
      - name: served copy is identical
        run: diff install.sh site/public/install.sh

      - name: shellcheck
        run: shellcheck install.sh

      - name: POSIX sh syntax
        run: sh -n install.sh
