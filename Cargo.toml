# Workspace split so a good terminal UI never costs the engine its
# embeddability.
#
#   stallwatch-core   std only, no dependencies, ever. This is what becomes
#                     libstallwatch behind a C ABI, and the only thing a C or
#                     C++ monitor (htop, ksystemstats, btop) could adopt.
#   stallwatch        the CLI. Also dependency-free, and the name published on
#                     crates.io, so `cargo install stallwatch` still pulls
#                     nothing at all.
#   stallwatch-tui    later. Takes ratatui and whatever else a TUI needs.
#                     Depends on core like any other consumer.
#
# The claim stays true and gets sharper: the engine has no dependencies, and
# the optional interface has the ones an interface requires.

[workspace]
resolver = "3"
members = ["crates/core", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/varbees/stallwatch"
categories = ["command-line-utilities", "os::linux-apis"]
keywords = ["psi", "cgroup", "diagnostics", "performance", "linux"]

[workspace.dependencies]
stallwatch-core = { version = "0.1.0", path = "crates/core" }

[profile.release]
opt-level = "s"
lto = true
strip = true
